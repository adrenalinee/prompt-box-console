name: buildAndPushImage

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:

env:
  # --- Github 변수 ---
  REPOSITORY_PATH: 'mystix-ai'
  REPOSITORY_NAME: 'prompt-box'
  # GCP Project ID
  TARGET_PROJECT_ID: ${{ secrets.GCP_MYSTIX_PROJECT_ID_DEV }}
  # Cloud run 서비스명
  SERVICE_NAME: 'prompt-box-dev'
  # GCP Artifact Registry 경로 --- 이미지 경로 (이미지는 항상 DEV 프로젝트 GAR 사용) ---
  REGION: asia-northeast3
  IMAGE_PATH: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_MYSTIX_PROJECT_ID_DEV }}/mystix-ai

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

  # 1. GCP 인증
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_MYSTIX_SA_DEV }}

      # 2. 도커 인증 세션을 gcloud와 동기화 (이게 핵심!)
      - name: 'Docker Auth with gcloud'
        run: |
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet

      # 3.
      - name: Build and Push
        run: |
          ls -al
          
          # Tag 생성: {Branch}-{CommitHash10}
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-10)
          BUILD_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "Generated BUILD_TAG: ${BUILD_TAG}"
          echo "Generated BUILD_DATE: ${BUILD_DATE}"
          
          docker build \
            --build-arg BUILD_TAG="${BUILD_TAG}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            -t ${{ env.IMAGE_PATH }}/${{ env.REPOSITORY_NAME }}:${BUILD_TAG} .
          docker push ${{ env.IMAGE_PATH }}/${{ env.REPOSITORY_NAME }}:${BUILD_TAG}
          
          docker tag ${{ env.IMAGE_PATH }}/${{ env.REPOSITORY_NAME }}:${BUILD_TAG} ${{ env.IMAGE_PATH }}/${{ env.REPOSITORY_NAME }}:latest
          docker push ${{ env.IMAGE_PATH }}/${{ env.REPOSITORY_NAME }}:latest

      # 4. Cloud Run 배포
      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          project_id: ${{ env.TARGET_PROJECT_ID }}
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_PATH }}/${{ env.REPOSITORY_NAME }}:latest
          flags: '--port=3000 --allow-unauthenticated'